[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-diagnostic-harness"
version = "0.1.0"
description = "Empirical harness for diagnosing LLM code-agent reasoning traps, with Qwen code agents as first-class subjects."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
# The runtime is stdlib-only on purpose: fewer moving parts means more reproducible runs.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
adh = "adh.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
adh = ["builtin_cells/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "qwen_cli: drives the real `qwen` (Qwen Code) CLI; skipped when it is not installed",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/adh/builtin_cells"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/adh"]
exclude = ["src/adh/builtin_cells/"]
